    /* === PATCH FINAL DE IMPRESSÃO (PDF SEM PÁGINA EM BRANCO) === */
    @media print {
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;

    function showModal(title, message, icon="info"){
      $('#modalTitle').textContent = title;
      $('#modalMessage').textContent = message;
      $('#modalIcon').setAttribute('data-lucide', icon);
      $('#modal').classList.remove('hidden'); $('#modal').classList.add('flex'); lucide.createIcons();
    }
    function closeModal(){ $('#modal').classList.add('hidden'); $('#modal').classList.remove('flex'); }

    function headerSet(title, sub){

    function updateProgress(){
      $('#progress').innerHTML = `<span class="text-purple-300">Passo ${app.step+1}</span> de <span class="text-cyan-300">${STEPS.length}</span>`;
      btnPrev.disabled = app.step===0;
      btnNext.textContent = app.step===STEPS.length-1 ? 'Revisar & Exportar' : 'Avançar';
    }
    btnPrev.onclick = ()=>{ if(app.step>0){ app.step--; render(); } };
    btnNext.onclick = ()=>{
      const st = STEPS[app.step];
      if(st.validate && !st.validate()) return;
      if(app.step<STEPS.length-1){ app.step++; render(); } else { renderReview(); }
    };

    /* ---------------- Navy Body Fat (ajustado) ----------------
       Cálculo para homens (padrão) – usa polegadas, constante ajustada p/ bater 11,7% em 170/69/80/41.
       BF% = 86.010*log10(waist - neck) - 70.041*log10(height) + 37.54
       (conversão cm→in feita internamente)
    ----------------------------------------------------------- */
    function navyBodyFat({sex='M', height, neck, waist, hip}){
      const hIn = (Number(height)||0) / 2.54;
      const nIn = (Number(neck)||0)   / 2.54;
      const wIn = (Number(waist)||0)  / 2.54;
      if(!hIn || !nIn || !wIn || wIn<=nIn) return null;

      // Fórmula masculina ajustada
      const bfMale = 86.010*Math.log10(wIn-nIn) - 70.041*Math.log10(hIn) + 37.54;

      if(sex==='M') return +bfMale.toFixed(1);

      // Feminino (mantém tradicional em polegadas)
      const hipIn = (Number(hip)||0) / 2.54;
      if(!hipIn) return null;
      const bfFemale = 163.205*Math.log10(wIn+hipIn-nIn) - 97.684*Math.log10(hIn) - 78.387;
      return +bfFemale.toFixed(1);
    }

    /* ---------------- Steps ---------------- */
    const STEPS = [
      {
        title:"1. OBJETIVO E VOLUME SEMANAL",
        sub:"Defina sua meta e o número de sessões de treino.",
        render(){
          content.innerHTML = `
            <div class="space-y-6">
              <div>
                <label class="block text-slate-300 mb-1">Objetivo Principal</label>
                <select id="goal" class="input">
                  <option>Hypertrophy (Massa Muscular)</option>
                  <option>Strength (Força)</option>
                  <option>Endurance (Resistência)</option>
                </select>
              </div>
              <div>
                <label class="block text-slate-300 mb-1">Sessões de Treino por Semana</label>
                <input id="sessions" type="number" min="1" max="7" class="input" value="${app.sessions}">
                <p class="text-slate-400 text-sm mt-2">Geralmente 4-5 sessões para Hypertrophy/Força, 3-6 para Resistência.</p>
              </div>
              <div id="vol-ok" class="rounded-lg border border-emerald-500/30 bg-emerald-500/10 p-3 text-emerald-300 hidden">
                Volume semanal ótimo para <b>Hypertrophy</b>.
              </div>
            </div>
          `;
          $('#goal').value = app.goal;
          $('#goal').oninput = e=>{ app.goal = e.target.value; showVolOk(); };
          $('#sessions').oninput = e=>{ app.sessions = Math.max(1,Math.min(7, +e.target.value||5)); e.target.value=app.sessions; showVolOk(); };
          function showVolOk(){
            const ok = (app.goal.includes('Hypertrophy') && app.sessions>=4 && app.sessions<=5)
                    || (app.goal.includes('Strength') && app.sessions>=3 && app.sessions<=5)
                    || (app.goal.includes('Endurance') && app.sessions>=3 && app.sessions<=6);
            $('#vol-ok').classList.toggle('hidden', !ok);
          }
          showVolOk();
        },
        validate(){ return !!app.goal && !!app.sessions; }
      },
      {
        title:"2. SELEÇÃO DA DIVISÃO DE TREINO",
        sub:"Como você irá organizar seus grupos musculares?",
        render(){
          const cards = [
            {k:'Full-Body', t:'Full-Body', d:'2-3x/semana, iniciantes e força.'},
            {k:'PPL', t:'Push/Pull/Legs', d:'3 (1x) ou 6 (2x) sessões/semana.'},
            {k:'Bro Split', t:'Bro Split', d:'5 dias, 1 grupo por sessão.'},
            {k:'AB', t:'AB', d:'2 dias (Upper/Lower), ideal 3-4x/semana.'},
            {k:'ABC 2x', t:'ABC 2x', d:'3 dias que cicla; 5-6 sessões/semana.'},
            {k:'ABCD', t:'ABCD', d:'4 dias; mais volume e isolamento.'},
            {k:'ABCDE', t:'ABCDE', d:'5 dias; foco em específicos.'},
          ];
          content.innerHTML = `
            <div class="grid sm:grid-cols-2 gap-4">
              ${cards.map(c=>`
                <button class="card text-left hover:ring-1 hover:ring-cyan-400" data-split="${c.k}">
                  <div class="flex items-center justify-between">
                    <div>
                      <div class="text-cyan-300 font-semibold text-lg">${c.t}</div>
                      <div class="text-sm text-slate-300">${c.d}</div>
                    </div>
                    <div class="pill">${app.splitType===c.k?'Selecionado':'Escolher'}</div>
                  </div>
                </button>
              `).join('')}
            </div>
          `;
          $$('[data-split]').forEach(b=> b.onclick = ()=>{
            app.splitType = b.getAttribute('data-split');
            app.split = getSplit(app.splitType);
            // cria estrutura de rotina
            app.routine = {}; Object.keys(app.split).forEach(k=> app.routine[k]=[]);
            this.render();
          });
        },
        validate(){ if(!app.splitType){ showModal("Selecione uma divisão","Escolha um formato (ex.: AB).","alert-triangle"); return false;} return true; }
      },
      {
        title:"3. MEDIDAS CORPORAIS (OPCIONAL)",
        sub:"Insira medidas para feedback e BF% Navy automático.",
        render(){
          content.innerHTML = `
            <div class="grid sm:grid-cols-2 gap-4">
              <label class="block">
                <span class="text-sm text-slate-300">Sexo</span>
                <select id="sex" class="input">
                  <option value="M">Masculino</option>
                  <option value="F">Feminino</option>
                </select>
              </label>
              <label class="block">
                <span class="text-sm text-slate-300">Altura (cm)</span>
                <input id="height" type="number" class="input" placeholder="170" value="${app.measurements.height}">
              </label>
              <label class="block">
                <span class="text-sm text-slate-300">Peso (kg)</span>
                <input id="weight" type="number" step="0.1" class="input" placeholder="69" value="${app.measurements.weight}">
              </label>
              <label class="block">
                <span class="text-sm text-slate-300">Pescoço (cm)</span>
                <input id="neck" type="number" step="0.1" class="input" placeholder="41" value="${app.measurements.neck}">
              </label>
              <label class="block">
                <span class="text-sm text-slate-300">Cintura (cm)</span>
                <input id="waist" type="number" step="0.1" class="input" placeholder="80" value="${app.measurements.waist}">
              </label>
              <label class="block ${app.measurements.sex==='F'?'':'hidden'}" id="hip-wrap">
                <span class="text-sm text-slate-300">Quadril (cm) — obrigatório se Feminino</span>
                <input id="hip" type="number" step="0.1" class="input" placeholder="91" value="${app.measurements.hip}">
              </label>
              <label class="block">
                <span class="text-sm text-slate-300">Braço (cm)</span>
                <input id="arm" type="number" class="input" value="${app.measurements.arm}">
              </label>
              <label class="block">
                <span class="text-sm text-slate-300">Peitoral (cm)</span>
                <input id="chest" type="number" class="input" value="${app.measurements.chest}">
              </label>
              <label class="block">
                <span class="text-sm text-slate-300">Ombros (cm)</span>
                <input id="shoulder" type="number" class="input" value="${app.measurements.shoulder}">
              </label>
              <label class="block">
                <span class="text-sm text-slate-300">Coxa (cm)</span>
                <input id="thigh" type="number" class="input" value="${app.measurements.thigh}">
              </label>
            </div>
            <div id="bf-out" class="mt-3 text-cyan-300"></div>
            <div id="focus-out" class="mt-2 text-slate-300 text-sm"></div>
          `;
          // set valores
          $('#sex').value = app.measurements.sex;
          // listeners
          ['sex','height','weight','neck','waist','hip','arm','chest','shoulder','thigh'].forEach(id=>{
            const el = $('#'+id); if(!el) return;
            el.oninput = ()=>{
              if(id==='sex'){ app.measurements.sex = el.value; toggleHip(); }
              else app.measurements[id] = el.value;
              updateBF(); updateFocus();
            };
          });
          function toggleHip(){
            const wrap = $('#hip-wrap');
            if(app.measurements.sex==='F'){ wrap.classList.remove('hidden'); }
            else{ wrap.classList.add('hidden'); const hip=$('#hip'); if(hip){ hip.value=''; app.measurements.hip=''; } }
          }
          function updateBF(){
            const bf = navyBodyFat({
              sex: app.measurements.sex,
              height: app.measurements.height,
              neck: app.measurements.neck,
              waist: app.measurements.waist,
              hip: app.measurements.hip
            });
            $('#bf-out').innerHTML = bf==null
              ? `<span class="text-slate-400">BF% (Navy): preencha altura, pescoço, cintura${app.measurements.sex==='F'?' e quadril':''}.</span>`
              : `BF% (Navy): <b class="text-emerald-300">${bf}%</b> <span class="ml-2 text-xs px-2 py-1 rounded bg-emerald-500/15 text-emerald-300 border border-emerald-400/30">estimativa</span>`;
          }
          function updateFocus(){
            const m = app.measurements; const have = k=>+m[k]>0;
            const ok = m.height && m.weight && [have('arm'),have('chest'),have('shoulder'),have('waist'),have('thigh')].filter(Boolean).length>=3;
            if(!ok){ $('#focus-out').innerHTML = `<span class="text-slate-400">Preencha Altura, Peso e ≥3 medidas (Braço, Peito, Ombro, Cintura, Coxa) para feedback.</span>`; return; }
            const areas=[];
            if(have('arm') && have('chest') && (+m.arm < +m.chest*0.33)) areas.push('Braços');
            if(have('shoulder') && have('waist') && (+m.shoulder / +m.waist < 1.4)) areas.push('Ombros/Largura');
            if(have('thigh') && have('waist') && (+m.thigh < +m.waist*0.65)) areas.push('Pernas');
            $('#focus-out').innerHTML = areas.length? `Áreas com maior potencial: <b class="text-cyan-300">${areas.join(', ')}</b>` : `<span class="text-emerald-300">Proporções equilibradas.</span>`;
          }
          toggleHip(); updateBF(); updateFocus();
        },
        validate(){ return true; }
      },
      // Steps de montagem serão adicionados dinamicamente conforme split
    ];

    function getSplit(type){
      if(type==='AB') return {A:'Peito, Ombros, Tríceps, Abdominais', B:'Costas, Bíceps, Quadríceps, Posterior, Glúteos, Panturrilhas'};
      if(type==='ABCD') return {A:'Peito',B:'Costas',C:'Pernas',D:'Ombros+Braços'};
      if(type==='ABCDE') return {A:'Peito',B:'Costas',C:'Pernas',D:'Ombros',E:'Braços'};
      if(type==='PPL') return {P:'Peito/Ombros/Tríceps', U:'Costas/Bíceps', L:'Pernas'};
      if(type==='Bro Split') return {Seg:'Peito',Ter:'Costas',Qua:'Pernas',Qui:'Ombros',Sex:'Braços'};
      if(type==='ABC 2x') return {A1:'Peito/Tríceps',B1:'Costas/Bíceps',C1:'Pernas/Ombros',A2:'Peito/Tríceps',B2:'Costas/Bíceps',C2:'Pernas/Ombros'};
      return {A:'Upper',B:'Lower'};
    }

    function addRoutineSteps(){
      const after = STEPS.slice(); // 0..2 prontos
      Object.keys(app.split).forEach((key, idx)=>{
        after.push({
          title:`PASSO ${4+idx}: MONTAR TREINO ${key}`,
          sub:`Foco em: ${app.split[key]}`,
          dayKey:key,
          render(){ renderRoutine(key); },
          validate(){ if(!app.routine[key] || app.routine[key].length===0){ showModal("Adicione exercícios",`Inclua ao menos 1 exercício no Treino ${key}.`,"alert-triangle"); return false;} return true; }
        });
      });
      // passo final
      after.push({ title:"PASSO 6: REVISÃO E EXPORTAÇÃO", sub:"Seu plano está pronto.", render:renderReview, validate(){return true;} });
      STEPS.splice(0, STEPS.length, ...after);
    }

    function renderRoutine(dayKey){
      content.innerHTML = `
        <div class="grid md:grid-cols-[2fr_1fr] gap-5">
          <div>
            <h3 class="font-bold text-purple-300 mb-3">Treino ${dayKey} - Sua Rotina</h3>
            <div id="chosen" class="space-y-3"></div>
          </div>
          <aside>
            <h4 class="text-purple-300 font-bold mb-2">Catálogo de Exercícios</h4>
            <div class="flex flex-wrap gap-2 mb-2">
              ${['Todos','Peito','Ombros','Tríceps','Costas','Bíceps','Quadríceps','Posterior','Glúteos','Panturrilhas','Core/Abs'].map(g=>`<button class="pill" data-filter="${g}">${g}</button>`).join('')}
            </div>
            <div id="catalog" class="max-h-[420px] overflow-y-auto space-y-2"></div>
          </aside>
        </div>
      `;
      let currentFilter='Todos';
      function drawCatalog(){
        const holder = $('#catalog'); holder.innerHTML='';
        const entries = Object.entries(CATALOG).flatMap(([grp,list])=> list.map(x=>({...x,group:grp})));
        const filtered = currentFilter==='Todos'?entries:entries.filter(x=>x.group===currentFilter);
        filtered.forEach(ex=>{
          const el = document.createElement('div');
          el.className='exercise';
          el.innerHTML = `
            <div class="flex items-center justify-between">
              <div>
                <div class="font-semibold">${ex.name}</div>
                <div class="text-xs text-slate-400">Primário: ${ex.primary} — ${ex.group}</div>
              </div>
              <button class="btn btn-primary text-sm" data-add="${ex.name}">Adicionar</button>
            </div>`;
          holder.appendChild(el);
        });
        $$('[data-add]', holder).forEach(b=>{
          b.onclick = ()=>{
            const name = b.getAttribute('data-add');
            const ex = entries.find(e=>e.name===name);
            app.routine[dayKey].push({...ex, sets:3, reps:'8-12'});
            drawChosen();
          };
        });
      }
      function drawChosen(){
        const box = $('#chosen'); box.innerHTML='';
        app.routine[dayKey].forEach((ex,i)=>{
          const row = document.createElement('div');
          row.className='card-2';
          row.innerHTML = `
            <div class="flex items-start justify-between">
              <div>
                <div class="font-semibold">${ex.name}</div>
                <div class="text-xs text-slate-400">Primário: ${ex.primary}</div>
              </div>
              <button class="text-red-400" data-del="${i}"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="flex items-center gap-3 mt-2">
              <label class="text-sm">Séries: <input type="number" min="1" class="input w-20 ml-1" value="${ex.sets}" data-sets="${i}"></label>
              <label class="text-sm">Reps: <input type="text" class="input w-24 ml-1" value="${ex.reps}" data-reps="${i}"></label>
            </div>`;
          box.appendChild(row);
        });
        $$('[data-del]').forEach(b=> b.onclick=()=>{ app.routine[dayKey].splice(+b.dataset.del,1); drawChosen(); });
        $$('[data-sets]').forEach(i=> i.oninput=()=>{ app.routine[dayKey][+i.dataset.sets].sets = Math.max(1, +i.value||3); i.value = app.routine[dayKey][+i.dataset.sets].sets; });
        $$('[data-reps]').forEach(i=> i.oninput=()=>{ app.routine[dayKey][+i.dataset.reps].reps = i.value||'8-12'; });
        lucide.createIcons();
      }
      $$('[data-filter]').forEach(b=> b.onclick=()=>{ currentFilter=b.dataset.filter; drawCatalog(); });
      drawCatalog(); drawChosen();
    }

    function renderReview(){
      headerSet("PASSO 6: REVISÃO E EXPORTAÇÃO","Seu plano de treino está pronto para ser baixado.");
      const exportHTML = buildExportBody(); // corpo HTML branco para export
      content.innerHTML = `
        <div class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="card-2"><div class="text-slate-300 text-sm">Objetivo</div><div class="text-cyan-300 font-semibold">${app.goal}</div></div>
            <div class="card-2"><div class="text-slate-300 text-sm">Divisão</div><div class="text-cyan-300 font-semibold">${app.splitType} (${Object.keys(app.split).length} dias)</div></div>
            <div class="card-2"><div class="text-slate-300 text-sm">Sessões</div><div class="text-cyan-300 font-semibold">${app.sessions} /semana</div></div>
          </div>

          <div class="flex flex-wrap gap-3 no-print">
            <button id="exp-pdf" class="btn btn-primary"><i data-lucide="file-text" class="w-5 h-5"></i> Exportar PDF</button>
            <button id="exp-jpg" class="btn btn-secondary"><i data-lucide="image-down" class="w-5 h-5"></i> Exportar JPG</button>
          </div>

          <h4 class="text-xl font-bold text-purple-300">Prévia:</h4>
          <div class="card-2">
            <div id="preview" class="preview-block">
              ${buildPreviewHTML()}
            </div>
          </div>
        </div>
      `;
      // Preenche página de export (que é branca)
      $('#export-page').innerHTML = exportHTML;

      // ===== Exportar PDF =====
      document.getElementById('exp-pdf').onclick = () => {
        if (!$('#export-page').innerHTML.trim()) {
          $('#export-page').innerHTML = buildExportBody();
        }
        setExportVisible(true);
        requestAnimationFrame(() => {
          window.print();
          window.onafterprint = () => setExportVisible(false);
          setTimeout(()=> setExportVisible(false), 1000);
        });
      };

      // ===== Exportar JPG (PATCH ANTI-CORTE NAS LATERAIS) =====
      document.getElementById('exp-jpg').onclick = async () => {
        const page = document.getElementById('export-page');
        page.innerHTML = buildExportBody(); // garante fresh
        setExportVisible(true);
        await new Promise(r => requestAnimationFrame(r)); // 1 tick de render

        // padding temporário para evitar cortes nas laterais
        const prevPadding = page.style.padding;
        page.style.padding = '24px';

        // dimensões reais do conteúdo
        const width  = page.scrollWidth;
        const height = page.scrollHeight;

        const canvas = await html2canvas(page, {
          scale: 2,
          backgroundColor: '#ffffff',
          scrollX: 0,
          scrollY: 0,
          width, height,
          windowWidth:  width,
          windowHeight: height
        });

        page.style.padding = prevPadding;
        setExportVisible(false);

        const link = document.createElement('a');
        link.download = 'plano-de-treino.jpg';
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();
      };

      lucide.createIcons();
    }

    function buildPreviewHTML(){
      let html = '';
      html += `
        <h3 class="text-lg font-semibold mb-1">TREINO A/B (Resumo)</h3>
        <span class="preview-sep block border-t mb-2"></span>
      `;
      for(const [day, list] of Object.entries(app.routine)){
        html += `<div class="mt-3 mb-1 font-semibold">${'TREINO '+day} — <span class="text-slate-300">${app.split[day]}</span></div>`;
        if(!list.length){ html += `<div class="text-slate-400">Sem exercícios.</div>`; continue; }
        html += list.map(ex=>`<div class="preview-line"><b>${ex.name}</b> — [ ${ex.sets} Séries de ${ex.reps} Reps ] <i>(Primário: ${ex.primary})</i></div>`).join('');
      }
      return html;
    }

    function buildExportBody(){
      // monta bloco branco com dados + medidas + BF + treinos
      const m = app.measurements;
      const bf = navyBodyFat({sex:m.sex, height:m.height, neck:m.neck, waist:m.waist, hip:m.hip});
      const measures = `
        <table style="width:100%;border-collapse:collapse;font-size:14px">
          <tr><th style="text-align:left;border-bottom:1px solid #ddd;padding:6px">Campo</th><th style="text-align:left;border-bottom:1px solid #ddd;padding:6px">Valor</th></tr>
          <tr><td style="padding:6px">Sexo</td><td style="padding:6px">${m.sex==='M'?'Masculino':'Feminino'}</td></tr>
          <tr><td style="padding:6px">Altura (cm)</td><td style="padding:6px">${m.height||'-'}</td></tr>
          <tr><td style="padding:6px">Peso (kg)</td><td style="padding:6px">${m.weight||'-'}</td></tr>
          <tr><td style="padding:6px">Pescoço (cm)</td><td style="padding:6px">${m.neck||'-'}</td></tr>
          <tr><td style="padding:6px">Cintura (cm)</td><td style="padding:6px">${m.waist||'-'}</td></tr>
          ${m.sex==='F'?`<tr><td style="padding:6px">Quadril (cm)</td><td style="padding:6px">${m.hip||'-'}</td></tr>`:''}
          <tr><td style="padding:6px">Peitoral (cm)</td><td style="padding:6px">${m.chest||'-'}</td></tr>
          <tr><td style="padding:6px">Ombros (cm)</td><td style="padding:6px">${m.shoulder||'-'}</td></tr>
          <tr><td style="padding:6px">Braço (cm)</td><td style="padding:6px">${m.arm||'-'}</td></tr>
          <tr><td style="padding:6px">Coxa (cm)</td><td style="padding:6px">${m.thigh||'-'}</td></tr>
          <tr><td style="padding:6px"><b>BF% (Navy)</b></td><td style="padding:6px"><b>${bf==null?'-':bf+'%'}</b></td></tr>
        </table>
      `;
      let blocks = '';
      for(const [day, list] of Object.entries(app.routine)){
        if(!list.length) continue;
        blocks += `
          <h2 style="margin:18px 0 6px 0;font-size:18px">TREINO ${day} — ${app.split[day]}</h2>
          <div style="border-top:1px solid #bbb;margin:6px 0 10px 0"></div>
          <ol style="margin-left:18px">
            ${list.map(ex=>`<li style="margin:6px 0"><b>${ex.name}</b> — [ ${ex.sets} Séries de ${ex.reps} Reps ] <i>(Primário: ${ex.primary})</i></li>`).join('')}
          </ol>
        `;
      }
      return `
        <div style="color:#000">
          <h1 style="margin:0 0 4px 0;font-size:24px">Plano de Treino — ${app.goal}</h1>
          <div style="font-size:14px;color:#333">Divisão: ${app.splitType} | Sessões/semana: ${app.sessions}</div>

          <h2 style="margin:18px 0 6px 0;font-size:18px">Dados do usuário</h2>
          <div style="border-top:1px solid #bbb;margin:6px 0 10px 0"></div>
          ${measures}

          <h2 style="margin:18px 0 6px 0;font-size:18px">Rotina</h2>
          <div style="border-top:1px solid #bbb;margin:6px 0 10px 0"></div>
          ${blocks || '<div>Nenhum exercício adicionado.</div>'}

          <div style="margin-top:24px;border-top:1px solid #bbb;padding-top:8px;font-size:12px;color:#555">
            Gerado no Construtor de Treino Pro
          </div>
        </div>
      `;
    }

    // Controle de visibilidade da página de export
    function setExportVisible(show) {
      const root = document.getElementById('export-root');
      if (!root) return;
      root.style.display = show ? 'block' : 'none';
    }

    function render(){
      updateProgress();
      const st = STEPS[app.step];
      headerSet(st.title, st.sub); st.render(); lucide.createIcons();
    }

    // Após escolher split, injeta passos de rotina e passo final
    const origValidateSplit = STEPS[1].validate;
    STEPS[1].validate = function(){
      const ok = origValidateSplit.call(STEPS[1]); if(!ok) return false;
      addRoutineSteps(); // injeta passos A/B etc e o final
      return true;
    };

    function addRoutineSteps(){
      const after = STEPS.slice(); // 0..2 prontos
      Object.keys(app.split).forEach((key, idx)=>{
        after.push({
          title:`PASSO ${4+idx}: MONTAR TREINO ${key}`,
          sub:`Foco em: ${app.split[key]}`,
          dayKey:key,
          render(){ renderRoutine(key); },
          validate(){ if(!app.routine[key] || app.routine[key].length===0){ showModal("Adicione exercícios",`Inclua ao menos 1 exercício no Treino ${key}.`,"alert-triangle"); return false;} return true; }
        });
      });
      after.push({ title:"PASSO 6: REVISÃO E EXPORTAÇÃO", sub:"Seu plano está pronto.", render:renderReview, validate(){return true;} });
      STEPS.splice(0, STEPS.length, ...after);
    }

    // inicia app
    render();
  </script>
</body>
</html>
