<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construtor de Treino Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN (Futuristic Icons) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Configuração de tema Dark e Fonte Inter */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root {
            --color-primary: #06b6d4; /* Neon Cyan */
            --color-secondary: #c084fc; /* Neon Purple */
            --color-bg: #0f172a; /* Slate 900 */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            color: #f8fafc; /* Slate 50 */
        }

        /* Classes personalizadas para o tema futurista */
        .card-futuristic {
            background-color: #1e293b; /* Slate 800 */
            border: 1px solid #334155; /* Slate 700 */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out;
        }
        .input-futuristic {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 0.75rem;
            border-radius: 0.5rem;
            transition: border-color 0.2s;
        }
        .input-futuristic:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.5);
        }
        .btn-primary {
            background-color: var(--color-primary);
            color: #0f172a;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            transition: all 0.2s ease-in-out;
        }
        .btn-primary:hover {
            background-color: #0891b2;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
        }
        .btn-secondary {
            background-color: #334155;
            color: #cbd5e1;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            transition: all 0.2s ease-in-out;
        }
        .btn-secondary:hover {
            background-color: #475569;
            box-shadow: 0 0 5px rgba(192, 132, 252, 0.5);
        }
        .btn-filter {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-filter-active {
            background-color: var(--color-primary);
            color: #0f172a;
            box-shadow: 0 0 5px rgba(6, 182, 212, 0.8);
        }

        .step-header {
            border-bottom: 1px solid #334155;
        }

        .badge {
            display:inline-flex;
            align-items:center;
            gap:0.25rem;
            font-size:0.75rem;
            padding:0.25rem 0.5rem;
            border-radius:9999px;
            border:1px solid rgba(6, 182, 212, 0.35);
            background: rgba(6, 182, 212, 0.12);
            color:#22d3ee;
        }

        .catalog-chip {
            display:inline-flex;
            align-items:center;
            gap:0.35rem;
            padding:0.25rem 0.5rem;
            border-radius:0.5rem;
            background:#0b1324;
            border:1px solid #233047;
            color:#a8c7ff;
            font-size:0.75rem;
        }

        .exercise-card {
            background:#0b1324;
            border:1px solid #1d2a41;
        }

        /* Export container (fica oculto na página; só aparece na impressão) */
        #export-content { display:none; }

        @media print {
            body * { visibility: hidden; }
            #export-content, #export-content * { visibility: visible; }
            #export-content {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                color: #000; /* Preto para impressão */
                background-color: #fff; /* Fundo branco */
                padding: 2rem;
            }
            .no-print { display: none !important; }
        }

        /* === Ajustes de contraste do resumo/preview === */
        .preview-block h3 { color:#e2e8f0; }
        .preview-line { color:#cbd5e1; }
        .preview-line b { color:#f8fafc; }
        .preview-sep { border-color: rgba(6,182,212,.35); }
        @media print {
          #export-content, #export-content * {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            color:#000 !important;
            background:#fff !important;
          }
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-5xl mx-auto p-4 sm:p-6">
        <header class="mb-6 step-header pb-4">
            <h1 class="text-3xl sm:text-4xl font-extrabold">
                <span class="text-white">1. OBJETIVO E VOLUME SEMANAL</span>
            </h1>
            <p class="text-gray-400">Defina sua meta e o número de sessões de treino.</p>
        </header>

        <!-- Navegação e conteúdo -->
        <div class="space-y-6">
            <div id="progress" class="text-sm text-cyan-300"></div>

            <div id="content" class="card-futuristic rounded-xl p-4 sm:p-6"></div>

            <div class="flex justify-between items-center">
                <button id="btnBack" class="btn-secondary">Voltar</button>
                <button id="btnNext" class="btn-primary">Avançar</button>
            </div>
        </div>
    </div>

    <!-- Modal genérico -->
    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white text-black rounded-xl p-6 max-w-lg w-[92%] shadow-2xl">
            <div class="flex items-center gap-2 mb-2">
                <i id="modalIcon" data-lucide="info" class="w-5 h-5"></i>
                <h3 id="modalTitle" class="font-bold text-lg">Info</h3>
            </div>
            <p id="modalMessage" class="text-sm text-gray-700">Mensagem</p>
            <div class="mt-4 text-right">
                <button class="px-4 py-2 rounded bg-slate-800 text-white" onclick="closeModal()">Ok</button>
            </div>
        </div>
    </div>

    <!-- Container oculto para impressão/exportação -->
    <div id="export-content" class="hidden"></div>

    <script>
        function showModal(title, message, icon = "info") {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            const iconEl = document.getElementById('modalIcon');
            iconEl.setAttribute('data-lucide', icon);
            lucide.createIcons();
            const modal = document.getElementById('modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }
        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        /* ===== Estado da Aplicação ===== */
        const appState = {
            currentStep: 0,
            goal: null,
            volume: null,
            split: null,
            splitType: null,
            measurements: {},
            routine: {}, // { 'A': [], 'B': [] }
            activeFilter: 'Todos', // Filtro de catálogo
        };

        // ===== Util: Navy Body Fat (cm)
        // Homem: BF% = 86.010*log10(cintura - pescoco) - 70.041*log10(altura) + 36.76
        // Mulher: BF% = 163.205*log10(cintura + quadril - pescoco) - 97.684*log10(altura) - 78.387
        function navyBodyFatCM({sex, altura, pescoco, cintura, quadril}) {
            const log10 = (x) => Math.log10(Math.max(1, x));
            const H = Number(altura)||0, N = Number(pescoco)||0, W = Number(cintura)||0, Hip = Number(quadril)||0;
            if (!H || !N || !W || (sex==='F' && !Hip)) return null;
            if (sex==='M') return +(86.010*log10(W - N) - 70.041*log10(H) + 36.76).toFixed(1);
            return +(163.205*log10(W + Hip - N) - 97.684*log10(H) - 78.387).toFixed(1);
        }

        const STEPS = [
            { id: 0, title: "1. Objetivo e Volume Semanal", subtitle: "Defina sua meta e sessões", render: renderStep0_Goal, nextValidator: validateStep0_Goal },
            { id: 1, title: "2. Seleção da Divisão de Treino", subtitle: "Como organizar grupos musculares", render: renderStep1_Split, nextValidator: validateStep1_Split },
            { id: 2, title: "3. Medidas Corporais (Opcional)", subtitle: "Insira suas medidas para feedback de foco.", render: renderStep2_Measurements, nextValidator: () => true }, // Medida é opcional
            // Os passos de montagem de treino (3+) são adicionados dinamicamente
        ];

        /* ===== Catálogo (abreviado aqui; mantenha o seu catálogo completo) ===== */
        const EXERCISES_CATALOG = {
            'Peito': [
                { name: 'Supino reto com barra', primary: 'Peitoral Maior', group: 'Peito', visual: '🔴', desc: 'Fundamental para força e massa geral do peitoral.' },
                { name: 'Supino reto com halteres', primary: 'Peitoral Maior', group: 'Peito', visual: '🟠', desc: 'Permite maior amplitude e estabilização.' },
                { name: 'Supino inclinado com barra', primary: 'Peitoral Superior', group: 'Peito', visual: '🟠', desc: 'Foco na porção superior do peitoral.' },
                { name: 'Supino declinado com barra', primary: 'Peitoral Inferior', group: 'Peito', visual: '🟡', desc: 'Foco na porção inferior do peitoral.' },
                { name: 'Crucifixo com halteres no banco reto', primary: 'Peitoral Maior', group: 'Peito', visual: '🟢', desc: 'Isolamento e alongamento de fibras.' },
            ],
            'Ombros': [
                { name: 'Desenvolvimento com halteres', primary: 'Deltoide Anterior', group: 'Ombros', visual: '🟠', desc: 'Força e volume geral.' },
                { name: 'Elevação lateral', primary: 'Deltoide Lateral', group: 'Ombros', visual: '🟢', desc: 'Largura do ombro.' },
            ],
            'Tríceps': [
                { name: 'Tríceps testa', primary: 'Tríceps', group: 'Tríceps', visual: '🟢', desc: 'Isolamento de tríceps.' },
                { name: 'Mergulho em paralelas', primary: 'Tríceps', group: 'Tríceps', visual: '🟠', desc: 'Corpo livre com foco em tríceps/peitoral.' },
            ],
            'Costas': [
                { name: 'Barra fixa supinada', primary: 'Grande Dorsal', group: 'Costas', visual: '🟠', desc: 'Espessura e dorsais.' },
                { name: 'Remada curvada com barra', primary: 'Dorsais/Trapézio Médio', group: 'Costas', visual: '🟠', desc: 'Base de espessura.' },
            ],
            'Bíceps': [
                { name: 'Rosca direta com barra', primary: 'Bíceps', group: 'Bíceps', visual: '🟢', desc: 'Força e massa.' },
            ],
            'Quadríceps': [
                { name: 'Agachamento livre', primary: 'Quadríceps/Glúteos', group: 'Quadríceps', visual: '🔴', desc: 'Base de força de membros inferiores.' },
            ],
            'Posterior': [
                { name: 'Levantamento terra romeno', primary: 'Posterior de Coxa', group: 'Posterior', visual: '🟠', desc: 'Isquiotibiais e glúteos.' },
            ],
            'Glúteos': [
                { name: 'Elevação pélvica (hip thrust)', primary: 'Glúteos', group: 'Glúteos', visual: '🟠', desc: 'Força/hipertrofia de glúteos.' },
            ],
            'Panturrilhas': [
                { name: 'Gêmeos em pé', primary: 'Gastrocnêmio', group: 'Panturrilhas', visual: '🟢', desc: 'Resistência e volume.' },
            ],
            'Core/Abs': [
                { name: 'Prancha', primary: 'Core', group: 'Core/Abs', visual: '🟢', desc: 'Estabilidade e endurance.' },
                { name: 'Crunch', primary: 'Reto Abdominal', group: 'Core/Abs', visual: '🟢', desc: 'Isolamento simples.' },
            ],
        };

        /* ===== Navegação ===== */
        const contentArea = document.getElementById('content');
        const btnBack = document.getElementById('btnBack');
        const btnNext = document.getElementById('btnNext');

        btnBack.addEventListener('click', () => {
            if (appState.currentStep > 0) {
                navigateStep(appState.currentStep - 1);
            }
        });
        btnNext.addEventListener('click', () => {
            const current = STEPS[appState.currentStep];
            if (current && current.nextValidator && !current.nextValidator()) return;

            if (appState.currentStep === 1) {
                updateDynamicSteps();
            }

            if (appState.currentStep < STEPS.length - 1) {
                navigateStep(appState.currentStep + 1);
            } else {
                renderStep_ReviewExport();
            }
        });

        function getMuscleSplitStructure(type) {
            if (type === 'AB') return { 'A': 'Peito, Ombros, Tríceps, Abdominais', 'B': 'Costas, Bíceps, Quadríceps, Posterior, Glúteos, Panturrilhas' };
            if (type === 'PPL') return { 'P': 'Peito, Ombros, Tríceps', 'Puxa': 'Costas, Bíceps', 'L': 'Pernas (Quads, Posterior, Glúteos, Panturrilhas)' };
            if (type === 'Full-Body') return { 'F1': 'Corpo inteiro', 'F2': 'Corpo inteiro' };
            if (type === 'ABCD') return { 'A': 'Peito', 'B': 'Costas', 'C': 'Pernas', 'D': 'Ombros+Braços' };
            if (type === 'ABCDE') return { 'A': 'Peito', 'B': 'Costas', 'C': 'Pernas', 'D': 'Ombros', 'E': 'Braços' };
            if (type === 'Bro Split') return { 'Seg': 'Peito', 'Ter': 'Costas', 'Qua': 'Pernas', 'Qui': 'Ombros', 'Sex': 'Braços' };
            if (type === 'ABC 2x') return { 'A1': 'Peito/Tríceps', 'B1': 'Costas/Bíceps', 'C1': 'Pernas/Ombros', 'A2': 'Peito/Tríceps', 'B2': 'Costas/Bíceps', 'C2': 'Pernas/Ombros' };
            return { 'A': 'Peito, Ombros, Tríceps', 'B': 'Costas, Bíceps, Pernas' };
        }

        function updateNavigation() {
            const progress = document.getElementById('progress');
            const total = STEPS.length;
            const step = appState.currentStep + 1;
            progress.innerHTML = `<span class="text-purple-300">Passo ${step}</span> de ${total}`;
            if (appState.currentStep === total - 1) {
                btnNext.textContent = 'Revisar & Exportar';
                btnNext.classList.add('from-purple-500', 'to-pink-500', 'bg-gradient-to-r');
                btnNext.classList.remove('btn-primary');
            } else {
                btnNext.textContent = 'Avançar';
                btnNext.classList.add('btn-primary');
                btnNext.classList.remove('from-purple-500', 'to-pink-500', 'bg-gradient-to-r');
            }
        }

        function navigateStep(stepIndex) {
            appState.currentStep = stepIndex;
            updateNavigation();
            const step = STEPS[stepIndex];
            document.querySelector('header h1').innerHTML = `<span class="text-white">${step.title}</span>`;
            document.querySelector('header p').textContent = step.subtitle || '';
            step.render();
            lucide.createIcons();
        }

        /* ===== Passo 0: Objetivo e Volume ===== */
        function renderStep0_Goal() {
            contentArea.innerHTML = `
                <div class="space-y-6">
                    <div>
                        <label class="block text-gray-300 font-medium mb-1">Objetivo Principal:</label>
                        <select id="goal" class="input-futuristic w-full">
                            <option value="Hypertrophy (Massa Muscular)">Hypertrophy (Massa Muscular)</option>
                            <option value="Strength (Força)">Strength (Força)</option>
                            <option value="Endurance (Resistência)">Endurance (Resistência)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-gray-300 font-medium mb-1">Sessões de Treino por Semana:</label>
                        <input type="number" id="volume" min="1" max="7" class="input-futuristic w-full" placeholder="Ex: 5" />
                        <p class="text-gray-400 mt-2 text-sm">Geralmente 4-5 sessões para Hypertrophy/Força, 3-6 para Resistência.</p>
                    </div>

                    <div id="volume-feedback" class="rounded-lg p-3 bg-emerald-900/30 border border-emerald-600/30 text-emerald-200 text-sm hidden">
                        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 mr-2"></span>
                        <span>Volume semanal ótimo para <b>Hypertrophy</b>.</span>
                    </div>
                </div>
            `;

            document.getElementById('goal').addEventListener('change', e => {
                appState.goal = e.target.value;
                showVolumeFeedback();
            });
            document.getElementById('volume').addEventListener('input', e => {
                appState.volume = parseInt(e.target.value) || null;
                showVolumeFeedback();
            });

            appState.goal = appState.goal || "Hypertrophy (Massa Muscular)";
            appState.volume = appState.volume || 5;
            document.getElementById('goal').value = appState.goal;
            document.getElementById('volume').value = appState.volume;
            showVolumeFeedback();
        }

        function showVolumeFeedback() {
            const box = document.getElementById('volume-feedback');
            if (!appState.goal || !appState.volume) { box.classList.add('hidden'); return; }
            const ok = (appState.goal.includes('Hypertrophy') && appState.volume>=4 && appState.volume<=5)
                    || (appState.goal.includes('Strength') && appState.volume>=3 && appState.volume<=5)
                    || (appState.goal.includes('Endurance') && appState.volume>=3 && appState.volume<=6);
            box.classList.toggle('hidden', !ok);
        }

        function validateStep0_Goal() {
            if (!appState.goal || !appState.volume) {
                showModal("Campos incompletos", "Escolha o objetivo e informe o número de sessões/semana.", "alert-triangle");
                return false;
            }
            return true;
        }

        /* ===== Passo 1: Split ===== */
        function renderStep1_Split() {
            const options = [
                { key: 'Full-Body', title: 'Full-Body', desc: 'Treino do Corpo Inteiro. Ideal para 2-3 sessões/semana. Excelente para iniciantes e foco em força.' },
                { key: 'PPL', title: 'Push/Pull/Legs', desc: 'PPL (Empurrar, Puxar, Pernas). Excelente para 3 (1x) ou 6 (2x) sessões/semana.' },
                { key: 'Bro Split', title: 'Bro Split', desc: 'Treino de 5 dias, com foco em 1 grupo muscular grande por sessão (Ex: Segunda é dia de Peito).' },
                { key: 'AB', title: 'AB', desc: 'Divisão em 2 dias (Ex: Upper/Lower), ideal para 3-4 sessões/semana.' },
                { key: 'ABC 2x', title: 'ABC 2x', desc: 'Rotina de 3 dias que cicla (Ex: PPL 2x), ideal para 5-6 sessões/semana.' },
                { key: 'ABCD', title: 'ABCD', desc: 'Rotina de 4 dias, maior volume e mais isolamento. Pernas em um dia dedicado.' },
                { key: 'ABCDE', title: 'ABCDE', desc: 'Rotina de 5 dias, muito volume e foco em músculos específicos. Maior recuperação.' },
            ];

            contentArea.innerHTML = `
                <div class="grid sm:grid-cols-2 gap-4">
                    ${options.map(opt => `
                        <button class="card-futuristic p-4 text-left rounded-xl hover:ring-1 hover:ring-cyan-500"
                            onclick="selectSplit('${opt.key}')">
                            <div class="flex items-center justify-between">
                                <div>
                                    <div class="font-bold text-lg">${opt.title}</div>
                                    <div class="text-sm text-gray-400">${opt.desc}</div>
                                </div>
                                <span id="sel-${opt.key}" class="hidden text-emerald-400"><i data-lucide="check-circle" class="w-6 h-6"></i></span>
                            </div>
                        </button>
                    `).join('')}
                </div>
                <div class="text-right mt-4 text-sm text-gray-400">Escolha um formato. Ex.: AB para 3–4 sessões.</div>
            `;

            if (appState.splitType) document.getElementById(`sel-${appState.splitType}`)?.classList.remove('hidden');
            lucide.createIcons();
        }

        function selectSplit(key) {
            appState.splitType = key;
            appState.split = getMuscleSplitStructure(key);
            document.querySelectorAll('[id^="sel-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(`sel-${key}`).classList.remove('hidden');
        }

        function validateStep1_Split() {
            if (!appState.splitType) {
                showModal("Selecione uma divisão", "Você precisa escolher uma divisão de treino.", "alert-triangle");
                return false;
            }
            return true;
        }

        /* ===== Passo 2: Medidas (OPCIONAL) — com BF Navy + sexo/pescoço/quadril ===== */
        function renderStep2_Measurements() {
            const baseFields = [
                { id: 'arm', label: 'Braço (cm)' },
                { id: 'chest', label: 'Peitoral (cm)' },
                { id: 'shoulder', label: 'Ombros (cm)' },
                { id: 'waist', label: 'Cintura (cm)' },
                { id: 'thigh', label: 'Coxa (cm)' },
            ];

            contentArea.innerHTML = `
                <div class="space-y-6">
                    <p class="text-gray-400">Insira medidas em <b>centímetros</b> e <b>quilogramas</b> para feedback baseado no seu objetivo (<span class="text-cyan-400">${appState.goal}</span>). É opcional. Agora inclui <b>BF% (Navy)</b> automático.</p>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-gray-300 font-medium mb-1">Sexo:</label>
                            <select id="sex" class="input-futuristic w-full">
                                <option value="M">Masculino</option>
                                <option value="F">Feminino</option>
                            </select>
                        </div>
                        <div>
                            <label for="height" class="block text-gray-300 font-medium mb-1">Altura (cm):</label>
                            <input type="number" id="height" class="input-futuristic w-full" placeholder="170" value="${appState.measurements['height'] || ''}">
                        </div>
                        <div>
                            <label for="weight" class="block text-gray-300 font-medium mb-1">Peso (kg):</label>
                            <input type="number" id="weight" step="0.1" class="input-futuristic w-full" placeholder="69" value="${appState.measurements['weight'] || ''}">
                        </div>
                        <div>
                            <label for="neck" class="block text-gray-300 font-medium mb-1">Pescoço (cm):</label>
                            <input type="number" id="neck" step="0.1" class="input-futuristic w-full" placeholder="41" value="${appState.measurements['neck'] || ''}">
                        </div>
                        <div>
                            <label for="hip" class="block text-gray-300 font-medium mb-1">Quadril (cm) — obrigatório se Feminino</label>
                            <input type="number" id="hip" step="0.1" class="input-futuristic w-full" placeholder="91" value="${appState.measurements['hip'] || ''}">
                        </div>
                        ${baseFields.map(field => `
                            <div>
                                <label for="${field.id}" class="block text-gray-400 text-sm mb-1">${field.label}:</label>
                                <input type="number" id="${field.id}" class="input-futuristic w-full" value="${appState.measurements[field.id] || ''}">
                            </div>
                        `).join('')}
                    </div>

                    <div id="focus-feedback" class="p-4 rounded-lg text-sm mt-2 bg-slate-700/50">${generateFocusFeedback()}</div>
                    <div id="bf-feedback" class="text-cyan-300 mt-2"></div>
                </div>
            `;

            const ids = ['sex','height','weight','neck','waist','hip','arm','chest','shoulder','thigh'];
            ids.forEach(id => {
              const el = document.getElementById(id);
              if (!el) return;
              el.addEventListener('input', () => {
                const v = (id==='sex') ? el.value : parseFloat(el.value)||0;
                appState.measurements[id==='hip'?'hip':id] = v;
                document.getElementById('focus-feedback').innerHTML = generateFocusFeedback();
                updateBF();
              });
            });

            function updateBF(){
              const sex = document.getElementById('sex').value;
              const altura = document.getElementById('height').value;
              const pescoco = document.getElementById('neck').value;
              const cintura = document.getElementById('waist').value;
              const quadril = document.getElementById('hip').value;
              const bf = navyBodyFatCM({sex, altura, pescoco, cintura, quadril});
              const out = document.getElementById('bf-feedback');
              out.innerHTML = (bf==null)
                 ? '<span class="text-gray-400">BF% (Navy): preencha altura, pescoço e cintura '+(sex==='F'?'+ quadril':'')+'.</span>'
                 : 'BF% (Navy): <b class="text-emerald-300">'+bf+'%</b> <span class="ml-2 text-xs px-2 py-1 rounded bg-emerald-500/15 text-emerald-300 border border-emerald-400/30">estimativa</span>';
            }
            updateBF();
            lucide.createIcons();
        }

        function generateFocusFeedback() {
            const m = appState.measurements || {};
            const filled = ['arm','chest','shoulder','waist','thigh'].filter(k => !!m[k]).length;
            if (!m.height || !m.weight || filled < 3) {
                return `<div class="text-gray-400">Preencha Altura, Peso e pelo menos 3 medidas (Braço, Peito, Ombro, Cintura, Coxa) para feedback de foco mais preciso.</div>`;
            }
            const areas = [];
            if (m.arm && m.chest && m.arm < m.chest * 0.33) areas.push('Braços');
            if (m.shoulder && m.waist && m.shoulder / m.waist < 1.4) areas.push('Ombros/Largura');
            if (m.thigh && m.waist && m.thigh < m.waist * 0.65) areas.push('Pernas');
            if (areas.length === 0) return `<div class="text-emerald-300">Proporções gerais equilibradas ${'<span class="badge">bom ponto de partida</span>'}</div>`;
            return `Áreas com maior potencial de ganho: <b class="text-cyan-300">${areas.join(', ')}</b>`;
        }

        /* ===== Passos Dinâmicos de Montagem ===== */
        function updateDynamicSteps() {
            const after = STEPS.slice(0, 3);
            const splitKeys = Object.keys(getMuscleSplitStructure(appState.splitType));
            splitKeys.forEach((key, idx) => {
                after.push({
                    id: 3 + idx,
                    title: `PASSO ${4 + idx}: MONTAR TREINO ${key}`,
                    subtitle: `Foco em: ${getMuscleSplitStructure(appState.splitType)[key]}`,
                    render: () => renderStep_TrainingAssembly(key),
                    nextValidator: () => validateStep_TrainingAssembly(key),
                });
            });
            after.push({
                id: 3 + splitKeys.length,
                title: "PASSO 6: REVISÃO E EXPORTAÇÃO",
                subtitle: "Seu plano de treino está pronto para ser baixado!",
                render: renderStep_ReviewExport,
                nextValidator: () => true
            });
            STEPS.splice(0, STEPS.length, ...after);
            appState.routine = {};
            splitKeys.forEach(k => appState.routine[k] = []);
        }

        /* ===== Montagem do Treino (genérico para cada dia) ===== */
        let CATALOG_FILTER = 'Todos';
        function setFilter(group) {
            CATALOG_FILTER = group;
            document.querySelectorAll('[data-filter]').forEach(btn => {
                if (btn.getAttribute('data-filter') === group) {
                    btn.classList.add('btn-filter-active');
                } else {
                    btn.classList.remove('btn-filter-active');
                }
            });
            renderMuscleCatalog();
        }

        function renderMuscleCatalog() {
            const catalog = document.getElementById('catalog');
            const all = Object.entries(EXERCISES_CATALOG).flatMap(([grp, arr]) =>
                arr.map(x => ({...x, group: grp}))
            );
            const filtered = CATALOG_FILTER === 'Todos' ? all : all.filter(x => x.group === CATALOG_FILTER);
            catalog.innerHTML = filtered.map(ex => `
                <button class="exercise-card w-full text-left p-3 rounded-lg hover:ring-1 hover:ring-cyan-600"
                        onclick='addExercise(${JSON.stringify(ex).replace(/'/g,"&#39;")})'>
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="font-semibold">${ex.name}</div>
                            <div class="text-xs text-gray-400">${ex.desc || ''}</div>
                        </div>
                        <span class="catalog-chip">${ex.visual||'●'} <span class="text-xs">${ex.group}</span></span>
                    </div>
                </button>
            `).join('');
        }

        function renderExerciseCard(ex, idx, dayKey) {
            return `
                <div class="card-futuristic rounded-lg p-3 space-y-2">
                    <div class="flex items-center justify-between">
                        <div class="font-semibold">${ex.name}</div>
                        <button class="text-red-400" onclick="removeExercise('${dayKey}', ${idx})"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="text-sm text-gray-400">Séries:
                            <input type="number" min="1" max="10" class="input-futuristic mt-1 w-full" value="${ex.sets||3}" onchange="updateSetRep('${dayKey}', ${idx}, 'sets', this.value)">
                        </label>
                        <label class="text-sm text-gray-400">Repetições:
                            <input type="text" class="input-futuristic mt-1 w-full" value="${ex.reps||'8-12'}" onchange="updateSetRep('${dayKey}', ${idx}, 'reps', this.value)">
                        </label>
                    </div>
                    <div class="text-xs text-emerald-300">${'[ 3 Séries de 8-12 Reps ]'}</div>
                    <div class="text-xs text-gray-400"><b>(Primário: ${ex.primary})</b></div>
                </div>
            `;
        }

        function renderStep_TrainingAssembly(dayKey) {
            if (!appState.routine[dayKey]) appState.routine[dayKey] = [];
            contentArea.innerHTML = `
                <div class="grid md:grid-cols-[2fr_1fr] gap-5">
                    <div>
                        <h3 class="font-bold text-purple-300 mb-3">Treino ${dayKey} - Sua Rotina:</h3>
                        <div id="user-routine" class="space-y-3">
                            ${appState.routine[dayKey].map((ex, idx) => renderExerciseCard(ex, idx, dayKey)).join('')}
                        </div>
                    </div>
                    <aside class="space-y-3">
                        <h4 class="text-purple-300 font-bold">Catálogo de Exercícios:</h4>
                        <div class="flex flex-wrap gap-2">
                            ${['Todos','Peito','Ombros','Tríceps','Costas','Bíceps','Quadríceps','Posterior','Glúteos','Panturrilhas','Core/Abs'].map(g=>`
                                <button class="btn-filter ${g==='Todos'?'btn-filter-active':''}" data-filter="${g}" onclick="setFilter('${g}')">${g}</button>
                            `).join('')}
                        </div>
                        <div id="catalog" class="max-h-[420px] overflow-y-auto space-y-2"></div>
                    </aside>
                </div>
            `;
            renderMuscleCatalog();
            document.getElementById('user-routine').innerHTML =
                appState.routine[dayKey].map((ex, idx) => renderExerciseCard(ex, idx, dayKey)).join('');
            lucide.createIcons();
        }

        function addExercise(ex) {
            const step = STEPS[appState.currentStep];
            const dayKey = step.title.match(/TREINO\s([A-Za-z0-9]+)/)?.[1] || Object.keys(appState.routine)[0];
            appState.routine[dayKey].push({ ...ex, sets: 3, reps: '8-12' });
            document.getElementById('user-routine').innerHTML =
                appState.routine[dayKey].map((e, i) => renderExerciseCard(e, i, dayKey)).join('');
            lucide.createIcons();
        }
        function removeExercise(dayKey, idx) {
            appState.routine[dayKey].splice(idx,1);
            document.getElementById('user-routine').innerHTML =
                appState.routine[dayKey].map((e, i) => renderExerciseCard(e, i, dayKey)).join('');
        }
        function updateSetRep(dayKey, idx, field, val) {
            appState.routine[dayKey][idx][field] = field==='sets' ? parseInt(val)||3 : val;
        }
        function validateStep_TrainingAssembly(dayKey) {
            if (!appState.routine[dayKey] || appState.routine[dayKey].length===0) {
                showModal("Adicione exercícios", `Inclua ao menos 1 exercício no Treino ${dayKey} para prosseguir.`, "alert-triangle");
                return false;
            }
            return true;
        }

        /* ===== Passo 6: Revisão & Exportação (com contraste e PDF funcional) ===== */
        function renderStep_ReviewExport() {
            btnNext.disabled = true;
            btnBack.disabled = false;

            const exportHTML = generateExportContent();

            contentArea.innerHTML = `
                <div class="space-y-8">
                    <h3 class="text-2xl font-bold text-cyan-400 text-center">Rotina de Treino Concluída!</h3>
                    <div id="review-summary" class="grid grid-cols-1 md:grid-cols-3 gap-6 text-gray-400">
                        <div class="p-4 card-futuristic rounded-xl">
                            <p class="font-bold text-purple-400 mb-1">Objetivo:</p>
                            <p>${appState.goal}</p>
                        </div>
                        <div class="p-4 card-futuristic rounded-xl">
                            <p class="font-bold text-purple-400 mb-1">Divisão:</p>
                            <p>${appState.splitType} (${Object.keys(appState.split).length} Dias)</p>
                        </div>
                        <div class="p-4 card-futuristic rounded-xl">
                            <p class="font-bold text-purple-400 mb-1">Volume/Foco:</p>
                            <p>${appState.volume} sessões semanais.</p>
                        </div>
                    </div>

                    <div class="flex justify-center flex-wrap gap-4 no-print">
                        <button id="btn-export-all" class="btn-primary flex items-center">
                            <i data-lucide="file-text" class="w-5 h-5 mr-2"></i> Exportar Treino Completo (PDF/Print)
                        </button>
                        ${Object.keys(appState.routine).map(dayKey => `
                            <button id="btn-export-${dayKey}" class="btn-secondary flex items-center text-sm">
                                <i data-lucide="download" class="w-4 h-4 mr-1"></i> Exportar Treino ${dayKey} (PDF/Print)
                            </button>
                        `).join('')}
                    </div>

                    <p class="text-center text-sm text-gray-500 no-print">
                        <i data-lucide="info" class="inline-block w-4 h-4 mr-1"></i>
                        A exportação PDF/JPG é simulada através da janela de impressão. Use "Salvar como PDF".
                    </p>

                    <h4 class="text-xl font-bold text-purple-400 mt-8">Prévia da Rotina:</h4>
                    <div class="p-4 card-futuristic max-h-[50vh] overflow-y-auto">
                        <div id="routine-preview" class="text-gray-200 space-y-4">
                            ${exportHTML}
                        </div>
                    </div>
                </div>
            `;

            // Preenche o container oculto para impressão com versão fundo branco
            document.getElementById('export-content').innerHTML = `
                <div class="p-8 text-black bg-white">
                    <h1 class="text-2xl font-bold mb-4">Plano de Treino | ${appState.goal} - ${appState.splitType}</h1>
                    ${exportHTML}
                </div>
            `;

            // Handlers de export
            document.getElementById('btn-export-all').onclick = () => {
              const html = document.getElementById('routine-preview').innerHTML;
              document.getElementById('export-content').innerHTML = `
                <div class="p-8 text-black bg-white">
                  <h1 class="text-2xl font-bold mb-4">Plano de Treino | Completo</h1>
                  ${html}
                </div>`;
              setTimeout(()=>window.print(),0);
            };
            Object.keys(appState.routine).forEach(dayKey=>{
              const btn = document.getElementById(`btn-export-${dayKey}`);
              if (!btn) return;
              btn.onclick = ()=>{
                const exportHTMLDay = generateExportContent(dayKey);
                document.getElementById('export-content').innerHTML = `
                  <div class="p-8 text-black bg-white">
                    <h1 class="text-2xl font-bold mb-4">Plano de Treino | Treino ${dayKey}</h1>
                    ${exportHTMLDay}
                  </div>`;
                setTimeout(()=>window.print(),0);
              }
            });

            lucide.createIcons();
        }

        function generateExportContent(dayFilter = null) {
            let html = '';
            for (const [dayKey, exercises] of Object.entries(appState.routine)) {
                if (dayFilter && dayKey !== dayFilter) continue;
                if (exercises.length === 0) continue;

                html += `
                    <div class="mb-6 pb-4 border-b border-gray-300 preview-block">
                        <h3 class="text-xl font-extrabold mb-3">TREINO ${dayKey} (${appState.split[dayKey]})</h3>
                        <ol class="list-decimal ml-4 space-y-3">
                            ${exercises.map((ex, index) => `
                                <li class="preview-line text-base">
                                    <span class="font-bold">${ex.name}</span>
                                    <span class="ml-4 font-mono">[ ${ex.sets} Séries de ${ex.reps} Reps ]</span>
                                    <span class="ml-4 text-xs">(Primário: ${ex.primary})</span>
                                </li>
                            `).join('')}
                        </ol>
                    </div>
                `;
            }
            return html;
        }

        function exportRoutine(type) {
            const totalExercises = Object.values(appState.routine).flat().length;
            if (totalExercises === 0) {
                 showModal("Erro de Exportação", "Por favor, adicione pelo menos um exercício ao seu treino antes de tentar exportar.", "alert-triangle");
                 return;
            }
            const dayKey = type === 'all' ? null : type;
            const contentToPrint = generateExportContent(dayKey);
            if (dayKey && appState.routine[dayKey].length === 0) {
                 showModal("Erro de Exportação", `O Treino ${dayKey} está vazio. Adicione exercícios para exportar.`, "alert-triangle");
                 return;
            }
            document.getElementById('export-content').innerHTML = `
                <div class="p-8 text-black bg-white">
                    <h1 class="text-2xl font-bold mb-4">Plano de Treino | ${type === 'all' ? 'Completo' : 'Treino ' + dayKey}</h1>
                    ${contentToPrint}
                </div>
            `;
            setTimeout(() => {
                window.print();
                showModal("Exportação Iniciada", `O Treino ${type==='all'?'Completo':dayKey} foi enviado para impressão/PDF. Utilize o diálogo do navegador para salvar.`, "download");
            }, 0);
        }

        /* ===== Início ===== */
        window.onload = function() {
            navigateStep(0);
        };
    </script>
</body>
</html>
