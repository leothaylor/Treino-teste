<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construtor de Treino Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN (Futuristic Icons) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Configuração de tema Dark e Fonte Inter */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        :root {
            --color-primary: #06b6d4; /* Neon Cyan */
            --color-secondary: #c084fc; /* Neon Purple */
            --color-bg: #0f172a; /* Slate 900 */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-bg);
            color: #f8fafc; /* Slate 50 */
        }

        /* Classes personalizadas para o tema futurista */
        .card-futuristic {
            background-color: #1e293b; /* Slate 800 */
            border: 1px solid #334155; /* Slate 700 */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out;
        }
        .input-futuristic {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 0.75rem;
            border-radius: 0.5rem;
            transition: border-color 0.2s;
        }
        .input-futuristic:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.5);
        }
        .btn-primary {
            background-color: var(--color-primary);
            color: #0f172a;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            transition: all 0.2s ease-in-out;
        }
        .btn-primary:hover {
            background-color: #0891b2;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
        }
        .btn-secondary {
            background-color: #334155;
            color: #cbd5e1;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            transition: all 0.2s ease-in-out;
        }
        .btn-secondary:hover {
            background-color: #475569;
            box-shadow: 0 0 5px rgba(192, 132, 252, 0.5);
        }
        .btn-filter {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-filter-active {
            background-color: var(--color-primary);
            color: #0f172a;
            box-shadow: 0 0 5px rgba(6, 182, 212, 0.8);
        }
        .btn-filter-inactive {
            background-color: #334155;
            color: #cbd5e1;
        }
        .btn-filter-inactive:hover {
            background-color: #475569;
        }

        /* Classe para o PDF/JPG export */
        @media print {
            body * { visibility: hidden; }
            #export-content, #export-content * { visibility: visible; }
            #export-content {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                color: #000; /* Preto para impressão */
                background-color: #fff; /* Fundo branco */
                padding: 2rem;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">

            </div>
        </div>
    </div>
    
    <!-- Conteúdo oculto que será impresso/exportado -->

        // --- Lógica de Navegação ---
        function updateNavigation() {
            btnBack.disabled = appState.currentStep <= 0;
            const currentStepDef = STEPS[appState.currentStep] || {};
            const isLastStep = appState.currentStep === STEPS.length - 1;

            if (isLastStep) {
                btnNext.textContent = 'Revisar & Exportar';
                btnNext.classList.add('from-purple-500', 'to-pink-500', 'bg-gradient-to-r');
                btnNext.classList.remove('btn-primary');
                // btnNext.disabled é gerenciado pelo renderStep_ReviewExport
            } else {
                btnNext.textContent = 'Avançar';
                btnNext.classList.add('btn-primary');
                btnNext.classList.remove('from-purple-500', 'to-pink-500', 'bg-gradient-to-r');
                btnNext.disabled = false; 
            }
        }

        function navigateStep(direction) {
            if (direction > 0) {
                const currentValidator = STEPS[appState.currentStep].nextValidator;
                if (!currentValidator || !currentValidator()) {
                    showModal("Atenção", "Por favor, preencha todos os campos obrigatórios antes de avançar.", "alert-triangle");
                    return;
                }
            }

            const newStep = appState.currentStep + direction;

            if (newStep >= 0 && newStep < STEPS.length) {
                appState.currentStep = newStep;
            } else if (newStep >= STEPS.length) {
                 // Último passo -> Exportar
                 renderStep_ReviewExport();
                 return;
            }

            // Garante que o cabeçalho e subtítulo sejam atualizados
            document.getElementById('header-title').textContent = STEPS[appState.currentStep].title.toUpperCase();
            document.getElementById('header-subtitle').textContent = STEPS[appState.currentStep].subtitle;

            if (STEPS[appState.currentStep] && STEPS[appState.currentStep].render) {
                // Ao mudar o passo, resetamos o filtro de catálogo se estivermos na montagem de treino
                if (STEPS[appState.currentStep].title.includes('Montar Treino')) {
                    appState.activeFilter = 'Todos';
                }
                STEPS[appState.currentStep].render();
            }

            // Recria ícones Lucide
            lucide.createIcons();
            updateNavigation();
        }

        // --- Renderização dos Passos ---

        // Passo 0: Objetivo e Volume
        function renderStep0_Goal() {
            contentArea.innerHTML = `
                <div class="space-y-6">
                    <div>
                        <label for="goal" class="block text-gray-300 font-medium mb-2">Objetivo Principal:</label>

                        <p class="text-sm text-gray-500 mt-1">Geralmente 4-5 sessões para Hypertrophy/Força, 3-6 para Resistência.</p>
                    </div>

                    <div id="volume-feedback" class="p-4 rounded-lg text-sm transition-all duration-300 hidden"></div>
                </div>
            `;
            // Adiciona listener para feedback de volume
            document.getElementById('volume').addEventListener('input', showVolumeFeedback);
            showVolumeFeedback(); // Inicializa feedback
        }

        function showVolumeFeedback() {
            const goal = document.getElementById('goal').value;
            const volume = parseInt(document.getElementById('volume').value);
            const feedbackDiv = document.getElementById('volume-feedback');

            feedbackDiv.classList.add('hidden');
            feedbackDiv.innerHTML = '';

            if (goal && volume) {
                feedbackDiv.classList.remove('hidden');
                let message = "";
                let color = "bg-green-900/50 border-green-500 text-green-300";

                if (goal === 'Hypertrophy') {
                    if (volume >= 4 && volume <= 6) { message = '🟢 Volume semanal ótimo para Hypertrophy.'; }
                    else if (volume < 4) { message = '🟠 Volume baixo. Considere adicionar mais uma sessão.'; color = "bg-yellow-900/50 border-yellow-500 text-yellow-300"; }
                    else if (volume > 6) { message = '🔴 Volume muito alto. Risco de Over-reaching/Fadiga. Revise.'; color = "bg-red-900/50 border-red-500 text-red-300"; }
                } else if (goal === 'Strength') {
                    if (volume >= 3 && volume <= 5) { message = '🟢 Volume semanal balanceado para Força Máxima.'; }
                    else { message = '🟠 Certifique-se de que as sessões curtas/densas.'; color = "bg-yellow-900/50 border-yellow-500 text-yellow-300"; }
                } else if (goal === 'Endurance') {
                    if (volume >= 5 && volume <= 7) { message = '🟢 Alto volume semanal compatível com Resistência Localizada.'; }
                }

                feedbackDiv.className = `p-4 rounded-lg text-sm border ${color}`;
                feedbackDiv.innerHTML = message;
            }
        }

        function validateStep0_Goal() {
            const goal = document.getElementById('goal').value;
            const volume = document.getElementById('volume').value;
            if (!goal || !volume || parseInt(volume) < 2) return false;
            appState.goal = goal;
            appState.volume = parseInt(volume);
            return true;
        }

        function selectSplit(split) {
            appState.splitType = split;

                appState.routine[day] = [];

        function validateStep1_Split() {

        }

        // Passo 2: Medidas Corporais (Opcional, Feedback de Foco)
        function renderStep2_Measurements() {
            const measurementsFields = [
                { id: 'arm', label: 'Braço (cm)', desc: 'Bíceps/Tríceps' },
                { id: 'chest', label: 'Peitoral (cm)', desc: 'Massa do Peitoral' },

            ];

                <div class="space-y-6">

                </div>
            `;
            // Re-bind change listener for dynamic feedback update
            Object.keys(appState.measurements).forEach(key => {
                const input = document.getElementById(key);
                if (input) {
                    input.addEventListener('input', () => {
                        appState.measurements[key] = parseFloat(input.value) || 0;
                        document.getElementById('focus-feedback').innerHTML = generateFocusFeedback();

                    });

            });
            lucide.createIcons();

        function generateFocusFeedback() {
            const m = appState.measurements;
            const goal = appState.goal;
            const hasEssentialMeasurements = m.height && m.weight && m.height > 0 && m.weight > 0;
            
            // Checks if enough dimensional data is present (height, weight + 3 other dimensional measurements)
            const dimensionalCount = Object.keys(m).filter(key => key !== 'height' && key !== 'weight' && m[key] > 0).length;
            
            if (!hasEssentialMeasurements || dimensionalCount < 3) {
                return '<i data-lucide="scan" class="inline-block w-4 h-4 mr-1"></i> Preencha Altura, Peso e pelo menos 3 medidas dimensionais (Braço, Peito, Ombro, Cintura, Coxa) para feedback de foco mais preciso.';
            }

            let advice = [];
            
            // 1. Análise de IMC (apenas contextual)
            if (hasEssentialMeasurements) {
                const heightM = m.height / 100;
                const bmi = m.weight / (heightM * heightM);
                
                let bmiMsg = '';
                let color = 'text-green-400';
                if (bmi < 18.5) { bmiMsg = 'IMC Baixo: Priorize o consumo calórico e foque em força.'; color = 'text-red-400'; }
                else if (bmi >= 25) { bmiMsg = 'IMC Elevado: Se o objetivo é Hypertrophy, foque na composição corporal (dieta).'; color = 'text-orange-400'; }
                else { bmiMsg = 'IMC Saudável: Proporção Peso/Altura ideal para construir massa magra.'; }
                
                advice.push(`<span class="${color}">**Análise Base:** ${bmiMsg} (IMC: ${bmi.toFixed(1)})</span>`);
            }

            // 2. Simulação de Lógica de Foco (Baseado em Proporção e Meta)
            if (goal === 'Hypertrophy') {
                if (m.chest && m.shoulder && m.waist && m.waist > m.chest * 0.9) {
                    advice.push('🟢 **Foco no Tronco Superior:** A proporção Cintura/Peito sugere priorizar Peito e Costas para uma estética V-Taper (Maior ênfase em puxadas e elevações laterais).');
                }
                if (m.arm && m.thigh && m.arm / m.thigh < 0.3) {
                    advice.push('🟠 **Foco nos Braços/Ombros:** O volume do braço é baixo em relação à coxa. Aumente o volume de Bíceps, Tríceps e Deltóides (principalmente lateral).');
                }
            }
            // Lógica Força
            if (goal === 'Strength') {
                if (m.thigh && m.thigh < 60) {
                    advice.push('🔴 **Foco em Quadríceps/Posterior:** Para Força Máxima, a base das pernas (Agachamento/Terra) exige um bom volume de coxa. Treine pernas 2x/semana.');
                }
            }

            if (advice.length === (hasEssentialMeasurements ? 1 : 0)) {
                advice.push('<i data-lucide="check" class="inline-block w-4 h-4 mr-1 text-green-400"></i> Suas medidas estão bem proporcionais para o seu objetivo inicial.');
            }

            return '### Feedback de Foco (Simulação)\n' + advice.join('\n');
        }

        // Adiciona os passos de montagem de treino dinamicamente
        function updateDynamicSteps() {
            // Remove passos de treino antigos
            STEPS.splice(3);
            if (!appState.splitType) return;

            const splitStructure = getMuscleSplitStructure(appState.splitType);
            let stepIndex = 3;
            for (const [dayKey, muscles] of Object.entries(splitStructure)) {
                STEPS.push({
                    id: stepIndex,
                    title: `Passo ${stepIndex + 1}: Montar Treino ${dayKey}`,
                    subtitle: `Foco em: ${muscles.split(',').join(' | ')}`,
                    render: () => renderStep_TrainingAssembly(dayKey),
                    nextValidator: () => validateStep_TrainingAssembly(dayKey)
                });
                stepIndex++;
            }
            // Adiciona o passo final
            STEPS.push({
                id: STEPS.length,
                title: `Passo ${STEPS.length + 1}: Revisão e Exportação`,
                subtitle: 'Seu plano de treino está pronto para ser baixado!',
                render: renderStep_ReviewExport,
                nextValidator: () => true
            });
        }

        // Passo N: Montagem do Treino (A, B, C...)
        function renderStep_TrainingAssembly(dayKey) {
            // Filtra e prepara os nomes dos grupos musculares para o dia atual
            const musclesInDay = appState.split[dayKey].split(',').map(m => m.trim()).filter(m => EXERCISES_CATALOG[m]);
            const currentRoutine = appState.routine[dayKey] || [];
            
            // FILTRO: Obtém a lista de músculos filtrada
            const filteredMuscles = appState.activeFilter === 'Todos' 
                ? musclesInDay
                : musclesInDay.filter(m => m === appState.activeFilter);

            contentArea.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Coluna 1: Exercícios Adicionados (Treino ${dayKey}) -->
                    <div class="md:col-span-2 space-y-4">
                        <h3 class="text-2xl font-bold text-cyan-400">Treino ${dayKey} - Sua Rotina:</h3>
                        <div id="routine-list-${dayKey}" class="space-y-4 min-h-[150px] p-2">
                            ${currentRoutine.length === 0 ? '<p class="text-gray-500 text-center py-8">Nenhum exercício adicionado ainda. Comece a montar o treino no catálogo ao lado.</p>' : currentRoutine.map((ex, index) => renderExerciseCard(ex, dayKey, index)).join('')}
                        </div>
                    </div>

                    <!-- Coluna 2: Catálogo de Exercícios e Filtros -->
                    <div class="md:col-span-1 space-y-4">
                        <h3 class="text-xl font-bold text-purple-400">Catálogo de Exercícios:</h3>
                        
                        <!-- Botões de Filtro -->
                        <div class="flex flex-wrap gap-2">
                            <button onclick="setFilter('${dayKey}', 'Todos')" class="btn-filter ${appState.activeFilter === 'Todos' ? 'btn-filter-active' : 'btn-filter-inactive'}">
                                Todos
                            </button>
                            ${musclesInDay.map(muscle => `
                                <button onclick="setFilter('${dayKey}', '${muscle}')" class="btn-filter ${appState.activeFilter === muscle ? 'btn-filter-active' : 'btn-filter-inactive'}">
                                    ${muscle.includes('Quadríceps') ? 'Quadríceps' : muscle.includes('Posterior') ? 'Posterior' : muscle.includes('Glúteos') ? 'Glúteos' : muscle.includes('Panturrilhas') ? 'Panturrilhas' : muscle.includes('Abdominais') ? 'Core/Abs' : muscle}
                                </button>
                            `).join('')}
                        </div>

                        <!-- Lista Filtrada -->
                        <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                            ${filteredMuscles.map(muscle => renderMuscleCatalog(muscle, dayKey)).join('')}
                            
                            ${musclesInDay.length === 0 ? '<p class="text-gray-500 mt-4 text-center">Nenhum grupo muscular definido para este dia.</p>' : ''}
                            ${filteredMuscles.length === 0 && appState.activeFilter !== 'Todos' ? '<p class="text-gray-500 mt-4 text-center">Nenhum exercício para o filtro selecionado.</p>' : ''}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }
        
        function setFilter(dayKey, filter) {
            // Se mudar o treino (ex: de A para B), resetar o filtro
            if (!STEPS[appState.currentStep].title.includes(dayKey)) { // Check if we switched days
                 appState.activeFilter = 'Todos';
            } else {
                 appState.activeFilter = filter;
            }
            renderStep_TrainingAssembly(dayKey);
        }

        function renderMuscleCatalog(muscle, dayKey) {
            const exercises = EXERCISES_CATALOG[muscle] || [];
            if (exercises.length === 0) return '';

            return `
                <div class="card-futuristic p-4 rounded-lg">
                    <h4 class="text-lg font-semibold border-b border-slate-600 pb-2 flex items-center text-cyan-200">
                        <i data-lucide="armchair" class="w-4 h-4 mr-2"></i> ${muscle}
                    </h4>
                    <div class="mt-2 space-y-2">
                        ${exercises.map(ex => `
                            <div class="flex items-center justify-between p-2 rounded-md hover:bg-slate-700/70 transition">
                                <div>
                                    <span class="font-medium text-gray-100">${ex.name}</span>
                                    <p class="text-xs text-gray-400">Primário: ${ex.primary} | Secundário: ${ex.secondary}</p>
                                </div>
                                <button onclick="addExercise('${dayKey}', '${ex.name}')" class="text-green-500 hover:text-green-400 transition">
                                    <i data-lucide="plus-circle" class="w-5 h-5"></i>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderExerciseCard(ex, dayKey, index) {
            const intensityColor = ex.visual === '🔴' ? 'text-red-400' : ex.visual === '🟠' ? 'text-orange-400' : 'text-green-400';
            return `
                <div id="ex-card-${dayKey}-${index}" class="card-futuristic p-4 rounded-lg border-l-4 border-purple-500/50">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-lg font-bold text-purple-300"> <!-- Título do exercício com cor visível -->
                                ${ex.name}
                            </span>
                            <span class="text-sm ml-2 ${intensityColor} font-mono">${ex.visual}</span>
                            <p class="text-xs text-gray-500">${ex.desc}</p>
                        </div>
                        <button onclick="removeExercise('${dayKey}', ${index})" class="text-red-500 hover:text-red-400">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <div class="mt-4 grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-gray-400 text-sm">Séries:</label>
                            <input type="number" value="${ex.sets}" min="1" onchange="updateSetRep('${dayKey}', ${index}, 'sets', this.value)" class="input-futuristic w-full text-center">
                        </div>
                        <div>
                            <label class="block text-gray-400 text-sm">Repetições:</label>
                            <input type="text" value="${ex.reps}" onchange="updateSetRep('${dayKey}', ${index}, 'reps', this.value)" class="input-futuristic w-full text-center" placeholder="Ex: 8-12 ou 5">
                        </div>
                    </div>
                    
                    <!-- DADOS DE DETALHE NA PRÉVIA (Ajustado para cores de alto contraste) -->
                    <div class="mt-3 text-sm flex justify-between">
                        <span class="text-emerald-400 font-mono">
                            [ ${ex.sets} Séries de ${ex.reps} Reps ]
                        </span>
                        <span class="text-gray-100 text-right"> 
                            (Primário: <span class="text-gray-300">${ex.primary}</span>)
                        </span>
                    </div>
                </div>
            `;
        }

        function addExercise(dayKey, exerciseName) {
            // Busca o exercício no catálogo global
            const exData = Object.values(EXERCISES_CATALOG).flat().find(e => e.name === exerciseName);
            if (!exData) return;

            // Cria uma cópia mutável do exercício
            const newEx = {
                ...exData,
                sets: 3, // Padrão Mínimo (3 séries)
                reps: '8-12' // Padrão (8-12 repetições)
            };

            appState.routine[dayKey].push(newEx);
            renderStep_TrainingAssembly(dayKey);
        }

        function removeExercise(dayKey, index) {
            appState.routine[dayKey].splice(index, 1);
            renderStep_TrainingAssembly(dayKey);
        }

        function updateSetRep(dayKey, index, key, value) {
            if (key === 'sets') {
                appState.routine[dayKey][index].sets = parseInt(value) < 1 ? 1 : parseInt(value);
            } else if (key === 'reps') {
                appState.routine[dayKey][index].reps = value;
            }
        }

        function validateStep_TrainingAssembly(dayKey) {
            if (appState.routine[dayKey].length < 2) {
                showModal("Atenção", `O Treino ${dayKey} precisa de pelo menos 2 exercícios para ser concluído.`, "alert-triangle");
                return false;
            }
            return true;
        }

        // Último Passo: Revisão e Exportação
        function renderStep_ReviewExport() {
            // Desativa botões de navegação no passo final (a navegação está nos botões de exportar)
            btnNext.disabled = true;
            btnBack.disabled = false;

            // Gera o conteúdo HTML para exportação (fundo claro para impressão)
            const exportHTML = generateExportContent();

            contentArea.innerHTML = `
                <div class="space-y-8">
                    <h3 class="text-2xl font-bold text-cyan-400 text-center">Rotina de Treino Concluída!</h3>
                    <div id="review-summary" class="grid grid-cols-1 md:grid-cols-3 gap-6 text-gray-400">
                        <div class="p-4 card-futuristic rounded-xl">
                            <p class="font-bold text-purple-400 mb-1">Objetivo:</p>
                            <p>${appState.goal}</p>
                        </div>
                        <div class="p-4 card-futuristic rounded-xl">
                            <p class="font-bold text-purple-400 mb-1">Divisão:</p>
                            <p>${appState.splitType} (${Object.keys(appState.split).length} Dias)</p>
                        </div>
                        <div class="p-4 card-futuristic rounded-xl">
                            <p class="font-bold text-purple-400 mb-1">Volume/Foco:</p>
                            <p>${appState.volume} sessões semanais.</p>
                        </div>
                    </div>

                    <div class="flex justify-center flex-wrap gap-4 no-print">
                        <button onclick="exportRoutine('all')" class="btn-primary flex items-center">
                            <i data-lucide="file-text" class="w-5 h-5 mr-2"></i> Exportar Treino Completo (PDF/Print)
                        </button>
                        ${Object.keys(appState.routine).map(dayKey => `
                            <button onclick="exportRoutine('${dayKey}')" class="btn-secondary flex items-center text-sm">
                                <i data-lucide="download" class="w-4 h-4 mr-1"></i> Exportar Treino ${dayKey} (PDF/Print)
                            </button>
                        `).join('')}
                    </div>

                    <p class="text-center text-sm text-gray-500 no-print">
                        <i data-lucide="info" class="inline-block w-4 h-4 mr-1"></i>
                        A exportação PDF/JPG é simulada através da função de impressão do navegador (Ctrl+P) para uma versão amigável.
                    </p>

                    <h4 class="text-xl font-bold text-purple-400 mt-8">Prévia da Rotina:</h4>
                    <div class="p-4 card-futuristic max-h-[50vh] overflow-y-auto">
                        <!-- Corrigido o contraste na prévia, usando apenas classes de texto claro no container -->
                        <div id="routine-preview" class="text-gray-200 space-y-4"> 
                            ${exportHTML}
                        </div>
                    </div>
                </div>
            `;
            // Coloca o HTML gerado no container oculto para o print
            document.getElementById('export-content').innerHTML = `
                <div class="p-8 text-black bg-white">
                    <h1 class="text-2xl font-bold mb-4">Plano de Treino | ${appState.goal} - ${appState.splitType}</h1>
                    ${exportHTML}
                </div>
            `;
            lucide.createIcons();
        }

        function generateExportContent(dayFilter = null) {
            let html = '';
            for (const [dayKey, exercises] of Object.entries(appState.routine)) {
                if (dayFilter && dayKey !== dayFilter) continue;

                if (exercises.length === 0) continue;

                html += `
                    <div class="mb-6 pb-4 border-b border-gray-300">
                        <h3 class="text-xl font-extrabold mb-3 ${dayFilter ? 'text-gray-800' : 'text-cyan-400'}">TREINO ${dayKey} (${appState.split[dayKey]})</h3>
                        <ol class="list-decimal ml-4 space-y-3">
                            ${exercises.map((ex, index) => `
                                <li class="text-gray-800 text-base">
                                    <span class="font-bold">${ex.name}</span>
                                    <span class="ml-4 font-mono text-sm text-green-700">[ ${ex.sets} Séries de ${ex.reps} Reps ]</span>
                                    <span class="ml-4 text-xs text-gray-500">(Primário: ${ex.primary})</span>
                                </li>
                            `).join('')}
                        </ol>
                    </div>
                `;
            }
            return html;
        }

        function exportRoutine(type) {
            const totalExercises = Object.values(appState.routine).flat().length;
            if (totalExercises === 0) {
                 showModal("Erro de Exportação", "Por favor, adicione pelo menos um exercício ao seu treino antes de tentar exportar.", "alert-triangle");
                 return;
            }

            const dayKey = type === 'all' ? null : type;
            const contentToPrint = generateExportContent(dayKey);
            
            if (dayKey && appState.routine[dayKey].length === 0) {
                 showModal("Erro de Exportação", `O Treino ${dayKey} não possui exercícios. Adicione exercícios para exportar.`, "alert-triangle");
                 return;
            }

            // Injeta o HTML formatado para impressão no container oculto
            document.getElementById('export-content').innerHTML = `
                <div class="p-8 text-black bg-white">
                    <h1 class="text-2xl font-bold mb-4">Plano de Treino | ${type === 'all' ? 'Completo' : 'Treino ' + dayKey}</h1>
                    ${contentToPrint}
                </div>
            `;

            // FIX 2: Chama a função nativa de impressão/exportação com um pequeno delay
            // O delay (0ms) garante que a atualização do DOM seja processada antes da chamada de impressão
            setTimeout(() => {
                window.print();
                showModal("Exportação Iniciada", `O Treino ${type === 'all' ? 'Completo' : type} foi enviado para a sua função de impressão/PDF. Utilize o diálogo do navegador para salvar.`, "download");
            }, 0);
        }

        // Início da Aplicação
        window.onload = function() {
            navigateStep(0); // Inicia no primeiro passo
        };
    </script>
</body>
</html>
